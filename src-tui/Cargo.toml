[package]
name = "smd-tui"
version = "1.5.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Terminal UI and headless CLI for Steam Manifest Downloader"
publish = false

[[bin]]
name = "smd"
path = "src/main.rs"

[features]
default = ["default-sources"]
default-sources = ["smd-core/default-sources"]

[dependencies]
smd-core = { path = "../src-core", default-features = false }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
unicode-width = "0.2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
