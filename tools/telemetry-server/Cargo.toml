[package]
name = "smd-telemetry-server"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "sync", "io-util"] }
tower-http = { version = "0.7", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dryoc = "1.0"
hex = "0.4"
chrono = { version = "0.4", features = ["clock"] }
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true