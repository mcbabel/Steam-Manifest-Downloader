ShortDescription: Download Steam depots from .lua/.st files or by App ID, add games to Steam and patch them with gbe_fork.
Description: |-
  Steam Manifest Downloader downloads Steam game depots straight from Steam's CDN. Start from a .lua or .st file or search by App ID across your depot sources.
  It keeps games up to date from its history, can add them to the Steam library and can patch them with the gbe_fork emulator and Steamless.
