version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    target-branch: dev
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - rust
    groups:
      cargo-app:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - rust
    groups:
      cargo-workspace:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /tools/telemetry-server
    target-branch: dev
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - rust
    groups:
      cargo-telemetry-server:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci(deps)
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
