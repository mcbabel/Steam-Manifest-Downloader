name: PR Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          if git diff --name-only "origin/$BASE_REF...HEAD" \
            | grep -qE '^(src-tauri|src-core|src-tui|public|assets|tools|\.github/workflows|\.github/actions)/|^Cargo\.(toml|lock)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            .

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --bin steam-manifest-downloader

      - name: Run core and terminal app tests
        run: cargo test --workspace --locked

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install cargo-binstall --locked && cargo binstall tauri-cli --version "^2.0" -y

      - name: Build
        env:
          SMD_BUILD_CHANNEL: pr-${{ github.event.pull_request.number }}
          SMD_GIT_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          export SMD_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cargo tauri build

      - name: Rename artifact
        shell: bash
        run: |
          VERSION=$(grep -oP '"version":\s*"\K[^"]+' src-tauri/tauri.conf.json)
          SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          mv src-tauri/target/release/steam-manifest-downloader.exe \
             "src-tauri/target/release/Steam-Manifest-Downloader_${VERSION}-pr${{ github.event.pull_request.number }}-${SHA}_portable.exe"

      - name: Upload portable EXE
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable-pr${{ github.event.pull_request.number }}
          path: src-tauri/target/release/Steam-Manifest-Downloader_*_portable.exe

  build-linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: AppImage name
        id: name
        run: |
          VERSION=$(grep -oP '"version":\s*"\K[^"]+' src-tauri/tauri.conf.json)
          SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          echo "file=Steam Manifest Downloader_${VERSION}-pr${{ github.event.pull_request.number }}-${SHA}_amd64.AppImage" >> "$GITHUB_OUTPUT"

      - name: Build AppImage
        uses: ./.github/actions/linux-appimage
        with:
          channel: pr-${{ github.event.pull_request.number }}
          git-sha: ${{ github.event.pull_request.head.sha }}
          output: ${{ steps.name.outputs.file }}

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage-pr${{ github.event.pull_request.number }}
          path: "Steam Manifest Downloader_*_amd64.AppImage"

  build-tui-linux:
    name: Terminal app (Linux, static)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: tui-musl
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        env:
          SMD_BUILD_CHANNEL: pr-${{ github.event.pull_request.number }}
          SMD_GIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          export SMD_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cargo build --release --locked --target x86_64-unknown-linux-musl -p smd-tui
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: tui-linux-pr${{ github.event.pull_request.number }}
          path: target/x86_64-unknown-linux-musl/release/smd

  build-tui-windows:
    name: Terminal app (Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: tui
      - name: Build
        env:
          SMD_BUILD_CHANNEL: pr-${{ github.event.pull_request.number }}
          SMD_GIT_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          export SMD_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cargo build --release --locked -p smd-tui
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: tui-windows-pr${{ github.event.pull_request.number }}
          path: target/release/smd.exe
