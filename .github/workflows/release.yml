name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0)"
        required: true
        type: string
      name:
        description: "Release name (e.g. Steam Manifest Downloader v1.2.0)"
        required: false
        type: string
      body:
        description: "Release description (supports Markdown)"
        required: false
        type: string
      draft:
        description: "Create as draft release"
        required: false
        default: true
        type: boolean
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: cargo-packager@0.11.8

      - name: Build app
        env:
          SMD_BUILD_CHANNEL: stable
          SMD_GIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          export SMD_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cargo build --release --locked -p smd-gui

      - name: Build terminal app
        env:
          SMD_BUILD_CHANNEL: stable
          SMD_GIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          export SMD_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cargo build --release --locked -p smd-tui

      - name: Sign executables with SignTool
        if: env.SIGNING_CERTIFICATE != ''
        env:
          SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: packaging/windows-sign.ps1 "target\release\steam-manifest-downloader.exe" "target\release\smd.exe"

      - name: Build installer
        shell: bash
        run: |
          cargo packager --release -p smd-gui --formats nsis
          VERSION=$(bash packaging/version.sh)
          mkdir -p installer
          mv target/packages/*-setup.exe "installer/Steam Manifest Downloader_${VERSION}_x64-setup.exe"

      - name: Sign installer with SignTool
        if: env.SIGNING_CERTIFICATE != ''
        env:
          SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: packaging/windows-sign.ps1 (Get-ChildItem "installer\*.exe").FullName

      - name: Upload Windows NSIS installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: installer/*.exe

      - name: Upload portable EXE
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable
          path: target/release/steam-manifest-downloader.exe

      - name: Upload Windows terminal app
        shell: bash
        run: |
          VERSION=$(bash packaging/version.sh)
          mkdir -p tui-dist
          cp target/release/smd.exe "tui-dist/Steam-Manifest-Downloader-Terminal_${VERSION}_windows-x64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: tui-windows
          path: tui-dist/*

  build-windows-standalone:
    name: Windows standalone ZIP
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-portable
          path: portable
      - name: Assemble ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(bash packaging/version.sh)
          LABEL="$VERSION"
          bash packaging/windows-standalone/build.sh portable/steam-manifest-downloader.exe "$LABEL" standalone-dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows-standalone
          path: standalone-dist/*.zip

  build-tui-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: tui-musl

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build terminal app
        env:
          SMD_BUILD_CHANNEL: stable
          SMD_GIT_SHA: ${{ github.sha }}
        run: |
          export SMD_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cargo build --release --locked --target x86_64-unknown-linux-musl -p smd-tui
          VERSION=$(bash packaging/version.sh)
          mkdir -p tui-dist
          cp target/x86_64-unknown-linux-musl/release/smd "tui-dist/Steam-Manifest-Downloader-Terminal_${VERSION}_linux-x64"

      - uses: actions/upload-artifact@v7
        with:
          name: tui-linux
          path: tui-dist/*

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build AppImage
        uses: ./.github/actions/linux-appimage
        with:
          channel: stable
          git-sha: ${{ github.sha }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-builds
          path: "Steam Manifest Downloader_*_amd64.AppImage"

  build-macos:
    uses: ./.github/workflows/build-macos.yml
    with:
      channel: stable

  release:
    needs: [build-windows, build-windows-standalone, build-linux, build-tui-linux, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package manager manifests
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          SETUP=$(find artifacts/windows-nsis -name '*-setup.exe' -print -quit)
          ZIP=$(find artifacts/windows-standalone -name '*.zip' -print -quit)
          bash packaging/render-package-managers.sh "$TAG" "$SETUP" "$ZIP" artifacts/package-managers

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ inputs.name || format('Steam Manifest Downloader {0}', steps.tag.outputs.tag) }}
          body: ${{ inputs.body || '' }}
          generate_release_notes: ${{ inputs.body == '' || inputs.body == null }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          files: |
            artifacts/windows-nsis/*
            artifacts/windows-standalone/*
            artifacts/linux-builds/*
            artifacts/tui-linux/*
            artifacts/tui-windows/*
            artifacts/macos-dmg/*
            artifacts/tui-macos/*
            artifacts/package-managers/*

  aur:
    name: AUR packages
    needs: release
    if: ${{ !inputs.draft && !inputs.prerelease }}
    uses: ./.github/workflows/aur.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  docker:
    name: Docker image
    needs: release
    if: ${{ !inputs.draft && !inputs.prerelease }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      channel: stable
      release-tag: ${{ inputs.tag }}
