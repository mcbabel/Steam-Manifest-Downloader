name: Build Windows (Test)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-packager@0.11.8

      - name: Build
        run: cargo build --release --locked -p smd-gui

      - name: Build installer
        shell: bash
        run: |
          cargo packager --release -p smd-gui --formats nsis
          VERSION=$(bash packaging/version.sh)
          mkdir -p installer
          mv target/packages/*-setup.exe "installer/Steam Manifest Downloader_${VERSION}_x64-setup.exe"

      - name: Upload portable EXE
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable
          path: target/release/steam-manifest-downloader.exe

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: installer/*.exe
