name: Linux AppImage
description: Builds the desktop app as an AppImage

inputs:
  channel:
    description: Value for SMD_BUILD_CHANNEL
    required: true
  git-sha:
    description: Value for SMD_GIT_SHA
    required: true
  output:
    description: File name of the AppImage in the workspace. Empty keeps the name from the bundler.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install build dependencies
      shell: bash
      run: |
        if command -v file >/dev/null && command -v desktop-file-validate >/dev/null; then
          exit 0
        fi
        if sudo timeout 120 apt-get update && sudo timeout 120 apt-get install -y file desktop-file-utils; then
          exit 0
        fi
        command -v file >/dev/null
        echo "::warning::desktop-file-utils could not be installed, the desktop file is not validated"

    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2
      with:
        key: appimage

    - name: Install cargo-packager
      uses: taiki-e/cache-cargo-install-action@v2
      with:
        tool: cargo-packager@0.11.8

    - name: Build AppImage
      id: build
      shell: bash
      env:
        SMD_BUILD_CHANNEL: ${{ inputs.channel }}
        SMD_GIT_SHA: ${{ inputs.git-sha }}
        NO_STRIP: "true"
        APPIMAGE_EXTRACT_AND_RUN: "1"
        OUTPUT: ${{ inputs.output }}
      run: |
        export SMD_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        cargo build --release --locked -p smd-gui
        cargo packager --release -p smd-gui --formats appimage
        BUILT=$(ls target/packages/*.AppImage)
        NAME="$OUTPUT"
        [ -n "$NAME" ] || NAME="Steam Manifest Downloader_$(bash packaging/version.sh)_amd64.AppImage"
        mv "$BUILT" "$NAME"
        ls -la "$NAME"
        echo "file=$NAME" >> "$GITHUB_OUTPUT"

    - name: Check the AppImage
      shell: bash
      env:
        FILE: ${{ steps.build.outputs.file }}
      run: |
        chmod +x "$FILE"
        rm -rf squashfs-root
        "./$FILE" --appimage-extract >/dev/null
        test -x squashfs-root/usr/bin/steam-manifest-downloader
        ls squashfs-root/*.desktop
        rm -rf squashfs-root
