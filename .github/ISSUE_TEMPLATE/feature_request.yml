name: Feature request
description: Propose a new feature or an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please check the [open issues](https://github.com/MCbabel/Steam-Manifest-Downloader/issues) first, maybe someone asked for it already. Then a thumbs up there helps more than a new issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences on what you would like.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What does this solve, and when would you use it?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you imagine it working? Sketches or screenshots of other apps are welcome.
  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      multiple: true
      options:
        - Desktop app (GUI)
        - Terminal version (TUI / CLI)
        - Docker image
        - Emulator step (gbe_fork)
        - Downloads and depot sources
        - History and updates
        - Website or documentation
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you thought about, or tools that already do this.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Links, related issues, implementation ideas.
