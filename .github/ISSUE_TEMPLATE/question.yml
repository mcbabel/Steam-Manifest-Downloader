name: Question or support
description: Ask how something works or get help with the setup
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Many questions are answered in the [documentation](https://smd.mcbabel.de/documentation/) and the [Troubleshooting and FAQ](https://smd.mcbabel.de/documentation/#troubleshooting).

        For security questions please do not open a public issue. See [SECURITY.md](https://github.com/MCbabel/Steam-Manifest-Downloader/blob/main/SECURITY.md).
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you already tried
      description: Steps, settings or documentation pages you already looked at.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.5.0"
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, Ubuntu 24.04 ...
