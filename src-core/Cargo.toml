[package]
name = "smd-core"
version = "1.4.3"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Frontend-agnostic download pipeline and services shared by the GUI and the TUI"
publish = false

[features]
default = ["default-sources"]
default-sources = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
regex = "1"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
zip = "8"
chrono = { version = "0.4", features = ["serde"] }
dryoc = "2.0"
sevenz-rust = "0.6"
tar = "0.4"
bzip2 = "0.6"
walkdir = "2"
crc32fast = "1"
steam-vent = "0.5"
steam-vent-proto = "0.5"
vdf-reader = "0.3"
aes = "0.9"
cbc = "0.2"
ecb = "0.2"
sha1 = "0.11"
hex = "0.4"
lzma-rs = "0.3"
protobuf = "3.5"
byteorder = "1"
futures = "0.3"
base64 = "0.23"
zstd = "0.14"
dirs = "7"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }
